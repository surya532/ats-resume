<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ATS Resume Optimizer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:          #0d0d12;
      --surface:     #13131a;
      --surface2:    #1a1a24;
      --surface3:    #21212e;
      --border:      #2a2a3d;
      --border2:     #33334d;
      --text:        #e8e8f0;
      --text2:       #8b8ba8;
      --muted:       #52527a;
      --accent:      #6366f1;
      --accent2:     #818cf8;
      --accent3:     #4f46e5;
      --accent-dim:  #1a1a3d;
      --accent-glow: rgba(99,102,241,0.15);
      --success:     #34d399;
      --success-dim: #073022;
      --error:       #f87171;
      --error-dim:   #2d0f0f;
      --warning:     #fbbf24;
      --radius-sm:   6px;
      --radius:      10px;
      --radius-lg:   14px;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      font-size: 13px;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Header ───────────────────────────────────────────────────────── */
    header {
      height: 60px;
      padding: 0 20px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: linear-gradient(90deg, #0d0d12 0%, #111120 50%, #0d0d12 100%);
      border-bottom: 1px solid var(--border);
      position: relative;
      z-index: 10;
    }
    header::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse 60% 100% at 50% 0%, rgba(99,102,241,0.08) 0%, transparent 100%);
      pointer-events: none;
    }

    .header-left { display: flex; align-items: center; gap: 11px; }
    .header-icon {
      width: 34px; height: 34px; flex-shrink: 0;
      background: linear-gradient(135deg, var(--accent3), var(--accent2));
      border-radius: var(--radius-sm);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 2px 10px rgba(99,102,241,0.4);
    }
    .header-icon svg { color: #fff; }
    .header-brand { display: flex; flex-direction: column; gap: 1px; }
    .header-title { font-size: 14px; font-weight: 700; letter-spacing: -0.025em; color: var(--text); }
    .header-sub   { font-size: 10.5px; color: var(--muted); letter-spacing: 0.01em; }

    /* Header stepper progress */
    .header-progress { display: none; align-items: center; gap: 0; }
    .header-progress.visible { display: flex; }
    .hp-step { display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .hp-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--border2);
      transition: background 0.35s, transform 0.35s, box-shadow 0.35s;
      position: relative;
    }
    .hp-dot.running {
      background: var(--accent); transform: scale(1.4);
      box-shadow: 0 0 8px var(--accent);
      animation: hpulse 1.4s ease-in-out infinite;
    }
    .hp-dot.done  { background: var(--success); }
    .hp-dot.error { background: var(--error); }
    .hp-label {
      font-size: 7.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em;
      color: var(--muted); white-space: nowrap;
      transition: color 0.3s;
    }
    .hp-step:has(.hp-dot.done)    .hp-label { color: var(--success); }
    .hp-step:has(.hp-dot.running) .hp-label { color: var(--accent2); }
    .hp-step:has(.hp-dot.error)   .hp-label { color: var(--error); }
    .hp-connector {
      width: 22px; height: 1px;
      background: var(--border2);
      margin-bottom: 14px;
    }
    @keyframes hpulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

    /* ── Top section ─────────────────────────────────────────────────── */
    .top-section {
      flex-shrink: 0;
      padding: 12px 16px 10px;
      display: flex; flex-direction: column; gap: 10px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      position: relative;
    }

    /* Expand / collapse toggle */
    .expand-btn {
      position: absolute; top: 10px; right: 14px;
      width: 26px; height: 26px;
      background: transparent; border: 1px solid var(--border2);
      border-radius: var(--radius-sm); color: var(--muted);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; z-index: 2;
      transition: border-color 0.15s, color 0.15s, background 0.15s;
    }
    .expand-btn:hover, .expand-btn.active {
      border-color: var(--accent); color: var(--accent2); background: var(--accent-dim);
    }

    /* Full-screen input mode */
    body.inputs-full .top-section  { flex: 1; overflow: hidden; }
    body.inputs-full .steps-pane   { display: none; }
    body.inputs-full .inputs-row   { flex: 1; min-height: 0; }
    body.inputs-full .input-card   { flex: 1; }
    body.inputs-full .input-card-body { flex: 1; overflow: hidden; }
    body.inputs-full .input-card-body textarea { flex: 1; min-height: 0; resize: none !important; }
    body.inputs-full .tab-panel.active { flex: 1; display: flex; flex-direction: column; }
    body.inputs-full .upload-zone  { flex: 1; justify-content: center; }

    .inputs-row { display: flex; gap: 10px; }

    .input-card {
      flex: 1; background: var(--bg);
      border: 1px solid var(--border); border-radius: var(--radius-lg);
      overflow: hidden; display: flex; flex-direction: column;
    }

    .input-card-hd {
      display: flex; align-items: center; justify-content: space-between;
      padding: 8px 13px; border-bottom: 1px solid var(--border);
      background: var(--surface2); flex-shrink: 0;
    }

    .input-card-label {
      display: flex; align-items: center; gap: 6px;
      font-size: 9.5px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.1em; color: var(--muted);
    }

    .input-card-body {
      padding: 10px 12px; display: flex; flex-direction: column; gap: 8px;
    }

    /* ── Fields (voice / gen-form) ── */
    .field { display: flex; flex-direction: column; gap: 6px; }
    .field + .field { margin-top: 8px; }

    .field textarea, .input-card-body textarea {
      width: 100%; background: var(--surface2);
      border: 1px solid var(--border2); border-radius: var(--radius);
      color: var(--text); font-size: 12px; font-family: inherit;
      padding: 10px 12px; resize: vertical; line-height: 1.6;
      transition: border-color 0.15s, box-shadow 0.15s, background 0.15s;
    }
    .field textarea:focus, .input-card-body textarea:focus {
      outline: none; border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow); background: var(--bg);
    }
    .field textarea::placeholder, .input-card-body textarea::placeholder {
      color: var(--muted); font-size: 11.5px;
    }

    /* ── Upload tabs ── */
    .input-tabs {
      display: flex; background: var(--bg);
      border: 1px solid var(--border); border-radius: var(--radius-sm);
      padding: 3px; gap: 3px;
    }
    .input-tab {
      flex: 1; background: transparent; border: none;
      border-radius: 4px; color: var(--muted);
      font-size: 11px; font-weight: 600; font-family: inherit;
      padding: 5px; cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }
    .input-tab.active { background: var(--accent-dim); color: var(--accent2); }
    .input-tab:hover:not(.active) { color: var(--text); }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    /* ── Upload zone ── */
    .upload-zone {
      border: 1.5px dashed var(--border2); border-radius: var(--radius);
      padding: 14px 12px;
      display: flex; flex-direction: column; align-items: center; gap: 6px;
      cursor: pointer; text-align: center;
      transition: border-color 0.2s, background 0.2s;
    }
    .upload-zone:hover, .upload-zone.drag {
      border-color: var(--accent); background: rgba(99,102,241,0.05);
    }
    .upload-icon {
      width: 40px; height: 40px; border-radius: 50%;
      background: var(--surface3); border: 1px solid var(--border2);
      display: flex; align-items: center; justify-content: center;
      color: var(--muted);
    }
    .upload-zone p { font-size: 12px; color: var(--text2); line-height: 1.5; }
    .upload-zone p strong { color: var(--text); font-weight: 600; }
    .upload-formats { font-size: 10.5px; color: var(--muted); }

    .browse-btn {
      background: var(--surface3); border: 1px solid var(--border2);
      border-radius: var(--radius-sm); color: var(--text2);
      font-size: 11px; font-weight: 600; font-family: inherit;
      padding: 5px 16px; cursor: pointer; margin-top: 2px;
      transition: border-color 0.15s, color 0.15s;
    }
    .browse-btn:hover { border-color: var(--accent); color: var(--accent2); }

    .file-card {
      display: none;
      background: var(--surface2); border: 1px solid var(--border);
      border-left: 3px solid var(--success); border-radius: var(--radius);
      padding: 10px 12px; align-items: center; gap: 10px;
    }
    .file-card.visible { display: flex; }
    .file-card svg   { color: var(--success); flex-shrink: 0; }
    .file-name { font-size: 12px; font-weight: 600; flex: 1; word-break: break-all; }
    .file-size { font-size: 10.5px; color: var(--muted); }
    .file-remove {
      background: transparent; border: none; color: var(--muted);
      cursor: pointer; padding: 2px; line-height: 1; font-size: 16px;
    }
    .file-remove:hover { color: var(--error); }

    /* ── Voice toggle ── */
    .voice-toggle {
      width: 100%; background: transparent;
      border: 1px solid var(--border2); border-radius: var(--radius-sm);
      color: var(--muted); font-size: 11px; font-weight: 600; font-family: inherit;
      padding: 7px 11px; cursor: pointer;
      display: flex; align-items: center; justify-content: space-between; gap: 6px;
      transition: border-color 0.15s, color 0.15s;
    }
    .voice-toggle:hover { border-color: var(--accent); color: var(--text2); }
    .voice-toggle.open  { border-color: var(--accent-dim); color: var(--text2); }
    .voice-toggle svg   { transition: transform 0.2s; flex-shrink: 0; }
    .voice-toggle.open svg { transform: rotate(180deg); }
    .voice-inner { display: none; margin-top: 8px; }
    .voice-inner.open { display: block; }

    /* ── Actions row ──────────────────────────────────────────────────── */
    .actions-row { display: flex; gap: 8px; }

    .act-primary, .act-btn {
      display: flex; align-items: center; gap: 10px;
      padding: 11px 14px; border-radius: var(--radius);
      cursor: pointer; text-align: left; font-family: inherit;
      transition: transform 0.12s, box-shadow 0.15s;
    }
    .act-primary {
      flex: 1.2;
      background: linear-gradient(135deg, var(--accent3) 0%, var(--accent) 60%, var(--accent2) 100%);
      border: none; color: #fff;
      box-shadow: 0 2px 14px rgba(99,102,241,0.3);
    }
    .act-primary:hover:not(:disabled) {
      transform: translateY(-1px); box-shadow: 0 4px 22px rgba(99,102,241,0.45);
    }
    .act-primary:active:not(:disabled) { transform: translateY(0); }
    .act-primary:disabled { opacity: 0.3; cursor: not-allowed; box-shadow: none; }
    .act-btn {
      flex: 1; background: var(--surface2);
      border: 1px solid var(--border2); color: var(--text);
    }
    .act-btn:hover:not(:disabled) {
      border-color: var(--accent); background: rgba(99,102,241,0.06); transform: translateY(-1px);
    }
    .act-btn:disabled { opacity: 0.35; cursor: not-allowed; }
    .act-icon {
      width: 34px; height: 34px; border-radius: var(--radius-sm);
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .act-primary .act-icon { background: rgba(255,255,255,0.15); }
    .act-btn .act-icon { background: var(--surface3); font-size: 15px; }
    .act-body { flex: 1; min-width: 0; }
    .act-title { font-size: 12.5px; font-weight: 700; }
    .act-sub { font-size: 10.5px; margin-top: 2px; }
    .act-primary .act-sub { color: rgba(255,255,255,0.6); }
    .act-btn .act-sub { color: var(--muted); }

    /* ── Steps pane (output) ───────────────────────────────────────────── */
    .steps-pane {
      flex: 1; overflow-y: auto; padding: 14px 16px;
      display: flex; flex-direction: column; gap: 8px; min-height: 0;
      background: var(--bg);
    }

    /* ── Empty state ── */
    .empty-state {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 40px 24px; gap: 28px;
    }
    .empty-hero { text-align: center; }
    .empty-icon-wrap {
      width: 56px; height: 56px; border-radius: 16px;
      background: linear-gradient(135deg, var(--accent3), var(--accent2));
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 14px; box-shadow: 0 4px 20px rgba(99,102,241,0.3);
    }
    .empty-icon-wrap svg { color: #fff; }
    .empty-hero h3 { font-size: 17px; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 6px; }
    .empty-hero p  { font-size: 12.5px; color: var(--text2); line-height: 1.6; max-width: 320px; }

    /* ── Step cards ───────────────────────────────────────────────────── */
    .step-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 3px solid transparent;
      border-radius: var(--radius-lg);
      overflow: hidden;
      transition: border-color 0.25s, box-shadow 0.25s;
    }
    .step-card.running {
      border-color: var(--border2);
      border-left-color: var(--accent);
      box-shadow: 0 0 0 1px rgba(99,102,241,0.15), 0 4px 20px rgba(99,102,241,0.08);
    }
    .step-card.done  { border-left-color: var(--success); }
    .step-card.error { border-left-color: var(--error); }

    .step-header {
      display: flex; align-items: center; gap: 12px; padding: 13px 15px;
      cursor: default;
    }
    .step-card.running .step-header,
    .step-card.done    .step-header,
    .step-card.error   .step-header { cursor: pointer; }
    .step-card.done    .step-header:hover,
    .step-card.running .step-header:hover { background: rgba(255,255,255,0.015); }

    .step-num {
      width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0;
      background: var(--surface2); border: 1.5px solid var(--border2);
      display: flex; align-items: center; justify-content: center;
      font-size: 11.5px; font-weight: 700; color: var(--muted);
      transition: all 0.25s; position: relative;
    }
    /* Spinning ring for running state */
    .step-card.running .step-num::after {
      content: '';
      position: absolute; inset: -3px; border-radius: 50%;
      border: 2px solid transparent;
      border-top-color: var(--accent);
      animation: ring-spin 0.9s linear infinite;
    }
    .step-card.running .step-num { background: var(--accent-dim); border-color: var(--accent); color: var(--accent2); }
    .step-card.done    .step-num { background: var(--success-dim); border-color: var(--success); color: var(--success); }
    .step-card.error   .step-num { background: var(--error-dim);   border-color: var(--error);   color: var(--error); }
    @keyframes ring-spin { to { transform: rotate(360deg); } }

    .step-info { flex: 1; min-width: 0; }
    .step-title-row { display: flex; align-items: center; gap: 8px; }
    .step-title { font-size: 13px; font-weight: 600; color: var(--text); }
    .step-tag {
      font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em;
      padding: 2px 8px; border-radius: 20px; flex-shrink: 0;
    }
    .tag-amber  { background: rgba(251,191,36,0.12); color: #fcd34d; border: 1px solid rgba(251,191,36,0.28); }
    .tag-blue   { background: rgba(56,189,248,0.12);  color: #67d4f8; border: 1px solid rgba(56,189,248,0.25); }
    .tag-teal   { background: rgba(52,211,153,0.12);  color: #5eeab8; border: 1px solid rgba(52,211,153,0.25); }
    .tag-orange { background: rgba(251,146,60,0.12);  color: #fdba74; border: 1px solid rgba(251,146,60,0.25); }
    .tag-pink   { background: rgba(236,72,153,0.12);  color: #f0abcb; border: 1px solid rgba(236,72,153,0.25); }
    .tag-green  { background: rgba(52,211,153,0.12);  color: #34d399; border: 1px solid rgba(52,211,153,0.25); }

    .step-sub { font-size: 11px; color: var(--muted); margin-top: 2px; }

    .step-badge {
      flex-shrink: 0;
      font-size: 10.5px; font-weight: 600;
      background: var(--surface2); border: 1px solid var(--border2);
      border-radius: 20px; padding: 3px 10px; color: var(--muted);
      white-space: nowrap; transition: all 0.2s;
      display: flex; align-items: center; gap: 4px;
    }
    .step-card.running .step-badge { color: var(--accent2); border-color: rgba(99,102,241,0.4); background: var(--accent-dim); }
    .step-card.done    .step-badge { color: var(--success);  border-color: rgba(52,211,153,0.3); background: var(--success-dim); }
    .step-card.error   .step-badge { color: var(--error);    border-color: rgba(248,113,113,0.3); background: var(--error-dim); }

    .step-chevron {
      flex-shrink: 0; color: var(--muted); opacity: 0.5;
      transition: transform 0.2s, opacity 0.2s; display: none;
    }
    .step-card.running .step-chevron,
    .step-card.done    .step-chevron,
    .step-card.error   .step-chevron { display: block; }
    .step-card.open .step-chevron { transform: rotate(180deg); opacity: 0.8; }

    .step-body { padding: 0 15px 14px; display: none; }
    .step-card.open .step-body { display: block; }

    .step-output {
      background: var(--bg); border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 11px 13px; font-size: 11.5px; font-family: inherit;
      line-height: 1.75; max-height: 280px; overflow-y: auto;
      white-space: pre-wrap; word-break: break-word; color: var(--text2);
    }

    /* ── Final resume card ─────────────────────────────────────────────── */
    .final-card {
      background: var(--surface);
      border: 1px solid rgba(99,102,241,0.25);
      border-top: 2px solid var(--accent);
      border-radius: var(--radius-lg);
      overflow: hidden; flex-shrink: 0;
      box-shadow: 0 4px 24px rgba(99,102,241,0.1);
    }
    .final-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 16px; border-bottom: 1px solid var(--border);
      user-select: none; cursor: pointer;
      background: linear-gradient(90deg, rgba(99,102,241,0.07) 0%, transparent 100%);
    }
    .final-header:hover { background: linear-gradient(90deg, rgba(99,102,241,0.1) 0%, transparent 100%); }
    .final-header-left {
      display: flex; align-items: center; gap: 9px;
    }
    .final-doc-icon {
      width: 28px; height: 28px; border-radius: var(--radius-sm);
      background: var(--accent-dim); border: 1px solid rgba(99,102,241,0.3);
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .final-doc-icon svg { color: var(--accent2); }
    .final-title { font-size: 13px; font-weight: 700; color: var(--accent2); }
    .final-score-mini {
      font-size: 11px; font-weight: 700; padding: 2px 8px;
      border-radius: 20px; border: 1px solid;
    }
    .final-header-actions { display: flex; align-items: center; gap: 8px; }
    .final-chevron { transition: transform 0.2s; color: var(--muted); flex-shrink: 0; }

    .copy-btn {
      background: var(--surface2); color: var(--text2);
      border: 1px solid var(--border2); border-radius: var(--radius-sm);
      padding: 5px 12px; font-size: 11px; font-weight: 600; font-family: inherit;
      cursor: pointer; transition: border-color 0.15s, color 0.15s;
    }
    .copy-btn:hover { border-color: var(--accent); color: var(--accent2); }

    .diff-btn {
      background: transparent; color: var(--muted);
      border: 1px solid var(--border2); border-radius: var(--radius-sm);
      padding: 5px 10px; font-size: 11px; font-weight: 600; font-family: inherit;
      cursor: pointer; transition: border-color 0.15s, color 0.15s, background 0.15s;
    }
    .diff-btn:hover { border-color: var(--accent); color: var(--accent2); }
    .diff-btn.active { background: var(--accent-dim); border-color: var(--accent); color: var(--accent2); }

    .final-text {
      padding: 18px 20px; font-size: 13px; line-height: 1.85;
      max-height: 460px; overflow-y: auto;
    }
    .final-text h2 {
      font-size: 12px; font-weight: 700; margin: 16px 0 5px;
      color: var(--accent2); text-transform: uppercase; letter-spacing: 0.1em;
      border-bottom: 1px solid var(--border); padding-bottom: 4px;
    }
    .final-text h3     { font-size: 13px; font-weight: 700; margin: 11px 0 3px; color: var(--text); }
    .final-text h4     { font-size: 11.5px; font-weight: 600; margin: 8px 0 2px; color: var(--text2); }
    .final-text hr     { border: none; border-top: 1px solid var(--border); margin: 12px 0; }
    .final-text strong { font-weight: 600; color: var(--text); }
    .final-text .r-bullet {
      padding-left: 18px; position: relative; margin-bottom: 4px; color: var(--text2);
    }
    .final-text .r-bullet::before {
      content: '▸'; position: absolute; left: 0; color: var(--accent); font-size: 9px; top: 4px;
    }
    .final-text .r-line { margin-bottom: 2px; }
    .final-text .r-gap  { height: 10px; }

    /* ── ATS score card ── */
    .score-card {
      display: flex; align-items: center; gap: 24px;
      padding: 14px 20px; border-bottom: 1px solid var(--border);
      background: linear-gradient(90deg, rgba(99,102,241,0.05) 0%, transparent 80%);
    }
    .score-overall { display: flex; align-items: center; gap: 14px; flex-shrink: 0; }
    .score-col { text-align: center; }
    .score-lbl { font-size: 9px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.09em; margin-bottom: 4px; font-weight: 600; }
    .score-num { font-size: 34px; font-weight: 800; line-height: 1; letter-spacing: -0.04em; }
    .score-arrow { font-size: 16px; color: var(--muted); }
    .score-delta { font-size: 19px; font-weight: 800; margin-left: 2px; letter-spacing: -0.02em; }
    .score-breakdown { flex: 1; display: flex; flex-direction: column; gap: 8px; }
    .score-item { display: flex; align-items: center; gap: 9px; font-size: 11px; }
    .score-item-lbl { color: var(--text2); width: 100px; flex-shrink: 0; font-weight: 500; }
    .score-bar-wrap { flex: 1; background: var(--surface3); border-radius: 4px; height: 5px; overflow: hidden; }
    .score-bar { height: 100%; border-radius: 4px; transition: width 0.8s cubic-bezier(0.4,0,0.2,1); }
    .score-item-val { font-weight: 700; font-size: 11px; width: 64px; text-align: right; flex-shrink: 0; }
    .sc-green  { color: #34d399; }
    .sc-yellow { color: #fbbf24; }
    .sc-red    { color: #f87171; }
    .sc-muted  { color: var(--muted); font-weight: 400; }

    /* ── Final action buttons ── */
    .final-actions {
      display: flex; gap: 8px; padding: 10px 16px;
      border-top: 1px solid var(--border); background: var(--surface2);
    }
    .action-btn {
      flex: 1; background: var(--surface); border: 1px solid var(--border2);
      border-radius: var(--radius-sm); color: var(--text2);
      font-size: 11.5px; font-weight: 600; font-family: inherit; padding: 8px 10px;
      cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 5px;
      transition: border-color 0.15s, color 0.15s, background 0.15s;
    }
    .action-btn:hover:not(:disabled) {
      border-color: var(--accent); color: var(--accent2); background: var(--accent-glow);
    }
    .action-btn:disabled { opacity: 0.35; cursor: not-allowed; }

    /* ── Diff view ── */
    .diff-view { display: flex; border-top: 1px solid var(--border); }
    .diff-col { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0; }
    .diff-col:first-child { border-right: 1px solid var(--border); }
    .diff-panel-header {
      font-size: 9.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.09em;
      color: var(--muted); padding: 7px 13px; border-bottom: 1px solid var(--border);
      background: var(--surface2); flex-shrink: 0;
    }
    .diff-panel {
      overflow-y: auto; padding: 10px 12px;
      font-size: 11.5px; font-family: inherit; line-height: 1.7; max-height: 400px;
    }
    .diff-line { padding: 1px 5px; border-radius: 3px; white-space: pre-wrap; word-break: break-word; }
    .diff-added   { background: rgba(52,211,153,0.1); color: #34d399; }
    .diff-removed { background: rgba(248,113,113,0.1); color: #f87171; }
    .diff-same    { color: var(--text2); }

    /* ── Generated bullets ── */
    .bullets-card {
      background: var(--surface); border: 1px solid var(--border);
      border-left: 3px solid var(--accent); border-radius: var(--radius-lg); overflow: hidden;
    }
    .bullets-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 11px 15px; border-bottom: 1px solid var(--border); background: var(--surface2);
    }
    .bullets-header span  { font-size: 13px; font-weight: 600; }
    .bullets-header small { font-size: 11px; color: var(--muted); }
    .bullet-item {
      display: flex; align-items: flex-start; gap: 10px;
      padding: 10px 15px; border-bottom: 1px solid var(--border);
      font-size: 12.5px; line-height: 1.65;
    }
    .bullet-item:last-child { border-bottom: none; }
    .bullet-text { flex: 1; }
    .bullet-copy {
      flex-shrink: 0; background: transparent; border: 1px solid var(--border);
      border-radius: 5px; color: var(--muted); font-size: 10px;
      font-weight: 600; font-family: inherit; padding: 3px 9px; cursor: pointer; margin-top: 2px;
      transition: border-color 0.15s, color 0.15s; white-space: nowrap;
    }
    .bullet-copy:hover  { border-color: var(--accent); color: var(--accent2); }
    .bullet-copy.copied { border-color: var(--success); color: var(--success); }
    .bullets-streaming  { padding: 12px 15px; font-size: 12px; line-height: 1.7; white-space: pre-wrap; color: var(--text2); }

    /* ── Output cards (cover letter / interview prep) ── */
    .output-card {
      background: var(--surface); border: 1px solid var(--border);
      border-left: 3px solid var(--success); border-radius: var(--radius-lg); overflow: hidden;
    }
    .output-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 11px 15px; border-bottom: 1px solid var(--border); background: var(--surface2);
    }
    .output-header > span  { font-size: 13px; font-weight: 600; }
    .output-header > small { font-size: 11px; color: var(--muted); }
    .output-body {
      padding: 14px 16px; font-size: 12.5px; line-height: 1.85;
      white-space: pre-wrap; word-break: break-word;
      color: var(--text2); max-height: 400px; overflow-y: auto;
    }

    /* ── Retry button ── */
    .retry-step-btn {
      margin-top: 10px; display: block; width: 100%;
      background: var(--error-dim); border: 1px solid rgba(248,113,113,0.35);
      border-radius: var(--radius-sm); color: var(--error); font-size: 12px;
      font-weight: 600; font-family: inherit; padding: 8px; cursor: pointer;
      transition: opacity 0.15s;
    }
    .retry-step-btn:hover { opacity: 0.8; }

    /* ── Spinner ── */
    .spinner {
      display: inline-block; width: 9px; height: 9px;
      border: 1.5px solid rgba(99,102,241,0.3); border-top-color: var(--accent2);
      border-radius: 50%; animation: spin 0.65s linear infinite;
      vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }

    /* ── Scrollbars ── */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--muted); }

    /* ── PDF print frame ──────────────────────────────────────────────── */
    #printFrame { display: none; }

    @media print {
      header, .top-section, .steps-pane { display: none !important; }
      body { background: #fff; overflow: visible; height: auto; color: #000; }

      #printFrame {
        display: block !important;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        font-size: 10.5pt;
        line-height: 1.4;
        color: #111;
        background: #fff;
      }

      /* Name — first element in the frame */
      #printFrame .pr-name {
        font-size: 20pt; font-weight: 700; text-align: center;
        letter-spacing: -0.02em; color: #000;
        margin-bottom: 3pt; border: none !important;
        text-transform: none !important;
      }
      /* Contact line */
      #printFrame .pr-contact {
        font-size: 9.5pt; text-align: center; color: #444;
        margin-bottom: 8pt;
      }

      /* Section headers */
      #printFrame h2 {
        font-size: 9pt; font-weight: 700;
        text-transform: uppercase; letter-spacing: 0.09em;
        color: #000; border-bottom: 0.5pt solid #888;
        padding-bottom: 2pt; margin: 9pt 0 3pt;
      }
      #printFrame h3 { font-size: 10.5pt; font-weight: 700; margin: 5pt 0 1pt; color: #000; }
      #printFrame h4 { font-size: 9.5pt; font-weight: 400; color: #555; margin: 0 0 2pt; }

      /* Bullets */
      #printFrame .r-bullet {
        padding-left: 12pt; position: relative;
        margin-bottom: 2pt; font-size: 10pt; color: #111; line-height: 1.35;
      }
      #printFrame .r-bullet::before { content: '•'; position: absolute; left: 3pt; }

      /* Regular lines and gaps */
      #printFrame .r-line  { margin-bottom: 2pt; font-size: 10pt; line-height: 1.35; }
      #printFrame .r-gap   { height: 3pt; }
      #printFrame strong   { font-weight: 700; }
      #printFrame hr       { border: none; border-top: 0.5pt solid #ccc; margin: 5pt 0; }

      @page { size: letter; margin: 0.65in 0.85in; }
    }
  </style>
</head>
<body>

  <!-- ── Header ─────────────────────────────────────────────────────────── -->
  <header>
    <div class="header-left">
      <div class="header-icon">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
        </svg>
      </div>
      <div class="header-brand">
        <div class="header-title">ATS Resume Optimizer</div>
        <div class="header-sub">6-step AI pipeline · Cerebras inference</div>
      </div>
    </div>

    <div class="header-progress" id="headerProgress">
      <div class="hp-step">
        <div class="hp-dot" id="hp-risen"></div>
        <div class="hp-label">RISEN</div>
      </div>
      <div class="hp-connector"></div>
      <div class="hp-step">
        <div class="hp-dot" id="hp-xyz"></div>
        <div class="hp-label">XYZ</div>
      </div>
      <div class="hp-connector"></div>
      <div class="hp-step">
        <div class="hp-dot" id="hp-keyword-gap"></div>
        <div class="hp-label">Keywords</div>
      </div>
      <div class="hp-connector"></div>
      <div class="hp-step">
        <div class="hp-dot" id="hp-car"></div>
        <div class="hp-label">CAR</div>
      </div>
      <div class="hp-connector"></div>
      <div class="hp-step">
        <div class="hp-dot" id="hp-recruiter"></div>
        <div class="hp-label">Review</div>
      </div>
      <div class="hp-connector"></div>
      <div class="hp-step">
        <div class="hp-dot" id="hp-ats-score"></div>
        <div class="hp-label">Score</div>
      </div>
    </div>
  </header>

  <!-- ── Top section: inputs + action bar ───────────────────────────── -->
  <div class="top-section">
    <button class="expand-btn" id="expandInputsBtn" onclick="toggleInputsExpand()" title="Expand inputs">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/>
        <line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/>
      </svg>
    </button>
    <div class="inputs-row">

      <!-- Resume card -->
      <div class="input-card">
        <div class="input-card-hd">
          <span class="input-card-label">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <path d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
            </svg>
            Resume
          </span>
          <div class="input-tabs">
            <button class="input-tab active" id="tabUpload" onclick="switchTab('upload')">Upload</button>
            <button class="input-tab"        id="tabPaste"  onclick="switchTab('paste')">Paste</button>
          </div>
        </div>
        <div class="input-card-body">
          <div class="tab-panel active" id="panelUpload">
            <div class="upload-zone" id="uploadZone"
                 onclick="document.getElementById('fileInput').click()"
                 ondragover="handleDragOver(event)"
                 ondragleave="handleDragLeave(event)"
                 ondrop="handleDrop(event)">
              <input type="file" id="fileInput" accept=".pdf,.docx" hidden onchange="handleFileSelect(event)">
              <div class="upload-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
                  <path d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/>
                </svg>
              </div>
              <p><strong>Drop resume here</strong> or click to browse</p>
              <div class="upload-formats">PDF · DOCX</div>
            </div>
            <div class="file-card" id="fileCard">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <path d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
              </svg>
              <div>
                <div class="file-name" id="fileName">—</div>
                <div class="file-size" id="fileSize">—</div>
              </div>
              <button class="file-remove" title="Remove file" onclick="clearFile()">&#x2715;</button>
            </div>
          </div>
          <div class="tab-panel" id="panelPaste">
            <textarea id="resume" rows="6" placeholder="Paste your full resume here…"></textarea>
          </div>
          <button class="voice-toggle" id="voiceToggle" onclick="toggleVoice()">
            <span style="display:flex;align-items:center;gap:6px">
              <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <path d="M12 18.5A6.5 6.5 0 0 1 5.5 12V7a6.5 6.5 0 0 1 13 0v5a6.5 6.5 0 0 1-6.5 6.5z"/>
                <path d="M12 18.5v3M8 21.5h8"/>
              </svg>
              Voice &amp; Preferences
              <span style="font-weight:400;font-size:10px;color:var(--muted)">(optional)</span>
            </span>
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
          </button>
          <div class="voice-inner" id="voiceInner">
            <div class="field">
              <textarea id="voice" rows="2" placeholder="Words to avoid: passionate, synergy&#10;Preferred verbs: shipped, built, led"></textarea>
            </div>
          </div>
        </div>
      </div>

      <!-- Job Description card -->
      <div class="input-card">
        <div class="input-card-hd">
          <span class="input-card-label">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/>
            </svg>
            Job Description
          </span>
        </div>
        <div class="input-card-body">
          <textarea id="jd" rows="9" style="resize:none" placeholder="Paste the job description here…"></textarea>
        </div>
      </div>

    </div><!-- /inputs-row -->

    <!-- Action buttons -->
    <div class="actions-row">
      <button class="act-primary" id="runBtn" onclick="runPipeline()">
        <div class="act-icon">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor" stroke="none">
            <polygon points="5 3 19 12 5 21 5 3"/>
          </svg>
        </div>
        <div class="act-body">
          <div class="act-title">Run Pipeline</div>
          <div class="act-sub">Full 6-step ATS optimization</div>
        </div>
      </button>

      <button class="act-btn" id="quickCoverBtn" onclick="generateCoverLetter()">
        <div class="act-icon">✉</div>
        <div class="act-body">
          <div class="act-title">Cover Letter</div>
          <div class="act-sub">Tailored 3-paragraph letter</div>
        </div>
      </button>

      <button class="act-btn" id="quickInterviewBtn" onclick="generateInterviewPrep()">
        <div class="act-icon">🎯</div>
        <div class="act-body">
          <div class="act-title">Interview Prep</div>
          <div class="act-sub">8 targeted questions</div>
        </div>
      </button>

      <button class="act-btn" id="quickLinkedInBtn" onclick="generateLinkedIn()">
        <div class="act-icon">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor" style="color:var(--text2)">
            <path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"/>
            <rect x="2" y="9" width="4" height="12"/><circle cx="4" cy="4" r="2"/>
          </svg>
        </div>
        <div class="act-body">
          <div class="act-title">LinkedIn</div>
          <div class="act-sub">About + 3 headlines</div>
        </div>
      </button>
    </div>

  </div><!-- /top-section -->

  <!-- ── Output: pipeline steps + results ────────────────────────────── -->
  <div class="steps-pane" id="stepsPane">
    <div class="empty-state" id="emptyState">
      <div class="empty-hero">
        <div class="empty-icon-wrap">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
          </svg>
        </div>
        <h3>Ready to optimize</h3>
        <p>Paste your resume and job description above, then click <strong>Run Pipeline</strong> to start the 6-step AI optimization.</p>
      </div>
    </div>
  </div>

  <!-- Print frame: hidden normally, shown only during window.print() -->
  <div id="printFrame" aria-hidden="true"></div>

  <script src="app.js"></script>
</body>
</html>
