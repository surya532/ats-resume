<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ATS Resume Optimizer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f0f10;
      --surface: #1a1a1c;
      --border: #2a2a2e;
      --text: #e8e8ea;
      --muted: #6b6b72;
      --accent: #7c6af7;
      --accent-dim: #2d2858;
      --success: #4ade80;
      --error: #f87171;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      padding: 14px 24px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    header h1 { font-size: 16px; font-weight: 600; }
    header p  { font-size: 12px; color: var(--muted); margin-top: 2px; }

    .layout { display: flex; flex: 1; overflow: hidden; }

    /* ── Left panel ── */
    .inputs {
      width: 340px;
      flex-shrink: 0;
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 16px;
      gap: 12px;
      overflow-y: auto;
    }

    .field label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 5px;
    }
    .field textarea {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 7px;
      color: var(--text);
      font-size: 12px;
      font-family: inherit;
      padding: 9px 10px;
      resize: vertical;
      line-height: 1.55;
    }
    .field textarea:focus { outline: none; border-color: var(--accent); }
    .field textarea::placeholder { color: var(--muted); }

    /* ── Input tabs ── */
    .input-tabs {
      display: flex;
      border: 1px solid var(--border);
      border-radius: 7px;
      overflow: hidden;
      margin-bottom: 8px;
    }
    .input-tab {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--muted);
      font-size: 11px;
      font-weight: 600;
      padding: 7px;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }
    .input-tab.active {
      background: var(--accent-dim);
      color: var(--accent);
    }
    .input-tab:hover:not(.active) { color: var(--text); }

    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    /* ── Upload zone ── */
    .upload-zone {
      border: 1.5px dashed var(--border);
      border-radius: 9px;
      padding: 22px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      text-align: center;
    }
    .upload-zone:hover,
    .upload-zone.drag { border-color: var(--accent); background: rgba(124,106,247,0.04); }
    .upload-zone svg { color: var(--muted); }
    .upload-zone p   { font-size: 12px; color: var(--muted); line-height: 1.5; }
    .upload-zone p strong { color: var(--text); }

    .browse-btn {
      margin-top: 2px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 11px;
      font-weight: 600;
      padding: 6px 14px;
      cursor: pointer;
    }
    .browse-btn:hover { border-color: var(--accent); color: var(--accent); }

    /* ── File info card ── */
    .file-card {
      display: none;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 11px 14px;
      align-items: center;
      gap: 10px;
    }
    .file-card.visible { display: flex; }
    .file-card svg { color: var(--accent); flex-shrink: 0; }
    .file-name { font-size: 12px; font-weight: 600; flex: 1; word-break: break-all; }
    .file-size { font-size: 11px; color: var(--muted); }
    .file-remove {
      background: transparent;
      border: none;
      color: var(--muted);
      cursor: pointer;
      padding: 2px;
      line-height: 1;
      font-size: 16px;
    }
    .file-remove:hover { color: var(--error); }


    /* ── Buttons ── */
    .run-btn {
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 7px;
      padding: 11px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      transition: opacity 0.15s;
      margin-top: 4px;
    }
    .run-btn:hover:not(:disabled) { opacity: 0.85; }
    .run-btn:disabled { opacity: 0.35; cursor: not-allowed; }

    .divider {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 11px;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .gen-toggle {
      width: 100%;
      background: transparent;
      border: 1px dashed var(--border);
      border-radius: 7px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 500;
      padding: 9px;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .gen-toggle:hover       { border-color: var(--accent); color: var(--accent); }
    .gen-toggle.open        { border-color: var(--accent); color: var(--accent); border-style: solid; }
    .gen-toggle svg         { transition: transform 0.2s; }
    .gen-toggle.open svg    { transform: rotate(45deg); }

    .gen-form {
      display: none;
      flex-direction: column;
      gap: 10px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 12px;
    }
    .gen-form.open { display: flex; }

    .gen-row { display: flex; gap: 8px; align-items: flex-end; }
    .gen-count-wrap label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 5px;
    }
    .gen-count {
      width: 56px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 13px;
      font-weight: 600;
      padding: 7px 8px;
      text-align: center;
    }
    .gen-count:focus { outline: none; border-color: var(--accent); }
    .gen-btn {
      flex: 1;
      background: var(--accent-dim);
      color: var(--accent);
      border: 1px solid var(--accent);
      border-radius: 6px;
      padding: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .gen-btn:hover:not(:disabled) { opacity: 0.8; }
    .gen-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* ── Right panel ── */
    .pipeline {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      gap: 10px;
      font-size: 13px;
      text-align: center;
    }
    .empty-state svg { opacity: 0.25; margin-bottom: 4px; }

    /* ── Step cards ── */
    .step-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 9px;
      overflow: hidden;
    }
    .step-header {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 11px 14px;
    }
    .step-num {
      width: 26px; height: 26px;
      border-radius: 50%;
      background: var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 700;
      flex-shrink: 0;
      transition: background 0.2s, color 0.2s;
    }
    .step-card.running .step-num { background: var(--accent-dim); color: var(--accent); }
    .step-card.done    .step-num { background: #1a3a26; color: var(--success); }
    .step-card.error   .step-num { background: #3a1a1a; color: var(--error); }

    .step-title { font-size: 13px; font-weight: 600; }
    .step-sub   { font-size: 11px; color: var(--muted); margin-top: 1px; }

    .step-badge {
      margin-left: auto;
      font-size: 11px;
      color: var(--muted);
      white-space: nowrap;
    }
    .step-card.running .step-badge { color: var(--accent); }
    .step-card.done    .step-badge { color: var(--success); }
    .step-card.error   .step-badge { color: var(--error); }

    .step-chevron {
      flex-shrink: 0;
      margin-left: 8px;
      color: var(--muted);
      transition: transform 0.2s;
      display: none;
    }
    .step-card.running .step-chevron,
    .step-card.done    .step-chevron,
    .step-card.error   .step-chevron { display: block; }
    .step-card.open .step-chevron { transform: rotate(180deg); }

    .step-header { cursor: default; }
    .step-card.running .step-header,
    .step-card.done    .step-header,
    .step-card.error   .step-header { cursor: pointer; }

    .step-body { padding: 0 14px 14px; display: none; }
    .step-card.open .step-body { display: block; }

    .step-output {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px 12px;
      font-size: 11.5px;
      font-family: 'SF Mono', 'Fira Code', monospace;
      line-height: 1.6;
      max-height: 260px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-word;
    }

    /* ── Final resume card ── */
    .final-card {
      background: var(--surface);
      border: 1px solid var(--accent-dim);
      border-radius: 9px;
      overflow: hidden;
    }
    .final-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 11px 14px;
      border-bottom: 1px solid var(--accent-dim);
    }
    .final-header span { font-size: 13px; font-weight: 600; color: var(--accent); }
    .copy-btn {
      background: var(--accent-dim);
      color: var(--accent);
      border: none;
      border-radius: 6px;
      padding: 5px 11px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
    }
    .copy-btn:hover { opacity: 0.8; }
    .final-text {
      padding: 14px;
      font-size: 12.5px;
      line-height: 1.75;
      white-space: pre-wrap;
      max-height: 520px;
      overflow-y: auto;
    }

    /* ── Generated bullets ── */
    .bullets-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 9px;
      overflow: hidden;
    }
    .bullets-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 11px 14px;
      border-bottom: 1px solid var(--border);
    }
    .bullets-header span { font-size: 13px; font-weight: 600; }
    .bullets-header small { font-size: 11px; color: var(--muted); }
    .bullet-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      font-size: 12.5px;
      line-height: 1.6;
    }
    .bullet-item:last-child { border-bottom: none; }
    .bullet-text { flex: 1; }
    .bullet-copy {
      flex-shrink: 0;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 5px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 600;
      padding: 3px 8px;
      cursor: pointer;
      margin-top: 2px;
      transition: border-color 0.15s, color 0.15s;
      white-space: nowrap;
    }
    .bullet-copy:hover         { border-color: var(--accent); color: var(--accent); }
    .bullet-copy.copied        { border-color: var(--success); color: var(--success); }
    .bullets-streaming {
      padding: 12px 14px;
      font-size: 12px;
      font-family: 'SF Mono', 'Fira Code', monospace;
      line-height: 1.6;
      white-space: pre-wrap;
      color: var(--muted);
    }

    /* ── Retry button ── */
    .retry-step-btn {
      margin-top: 10px;
      display: block;
      width: 100%;
      background: transparent;
      border: 1px solid var(--error);
      border-radius: 6px;
      color: var(--error);
      font-size: 12px;
      font-weight: 600;
      padding: 8px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .retry-step-btn:hover { background: rgba(248,113,113,0.08); }

    /* ── Spinner ── */
    .spinner {
      display: inline-block;
      width: 9px; height: 9px;
      border: 1.5px solid var(--accent-dim);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.65s linear infinite;
      margin-right: 5px;
      vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <header>
    <h1>ATS Resume Optimizer</h1>
    <p>RISEN &rarr; XYZ &rarr; Keyword Gap &rarr; CAR &rarr; Recruiter Review &mdash; fully automated</p>
  </header>

  <div class="layout">
    <div class="inputs">

      <!-- Resume input -->
      <div class="field">
        <label>Resume</label>

        <div class="input-tabs">
          <button class="input-tab active" id="tabUpload" onclick="switchTab('upload')">Upload File</button>
          <button class="input-tab"        id="tabPaste"  onclick="switchTab('paste')">Paste Text</button>
        </div>

        <!-- Upload tab -->
        <div class="tab-panel active" id="panelUpload">
          <div class="upload-zone" id="uploadZone"
               onclick="document.getElementById('fileInput').click()"
               ondragover="handleDragOver(event)"
               ondragleave="handleDragLeave(event)"
               ondrop="handleDrop(event)">
            <input type="file" id="fileInput" accept=".pdf,.docx" hidden onchange="handleFileSelect(event)">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/>
            </svg>
            <p><strong>Drop your resume here</strong><br>PDF or DOCX</p>
            <button class="browse-btn" onclick="event.stopPropagation(); document.getElementById('fileInput').click()">Browse files</button>
          </div>

          <div class="file-card" id="fileCard">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
            </svg>
            <div>
              <div class="file-name" id="fileName">—</div>
              <div class="file-size" id="fileSize">—</div>
            </div>
            <button class="file-remove" title="Remove file" onclick="clearFile()">&#x2715;</button>
          </div>
        </div>

        <!-- Paste tab -->
        <div class="tab-panel" id="panelPaste">
          <textarea id="resume" rows="10" placeholder="Paste your full resume here..."></textarea>
        </div>
      </div>

      <!-- Voice -->
      <div class="field">
        <label>Voice &amp; Preferences <span style="font-weight:400;text-transform:none;">(optional)</span></label>
        <textarea id="voice" rows="3" placeholder="Words to avoid: passionate, synergy&#10;Preferred verbs: shipped, built, led"></textarea>
      </div>

      <!-- JD -->
      <div class="field">
        <label>Job Description</label>
        <textarea id="jd" rows="9" placeholder="Paste the job description here..."></textarea>
      </div>

      <button class="run-btn" id="runBtn" onclick="runPipeline()">Run All 5 Steps</button>

      <div class="divider">or</div>

      <button class="gen-toggle" id="genToggle" onclick="toggleGenForm()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
        Generate bullets to fill space
      </button>

      <div class="gen-form" id="genForm">
        <div class="field">
          <label>Describe the experience</label>
          <textarea id="genDesc" rows="4" placeholder="e.g. Led migration of legacy PHP monolith to microservices on AWS, team of 4, reduced deploy time"></textarea>
        </div>
        <div class="gen-row">
          <div class="gen-count-wrap">
            <label>Count</label>
            <input class="gen-count" id="genCount" type="number" min="1" max="8" value="3">
          </div>
          <button class="gen-btn" id="genBtn" onclick="generateBullets()">Generate</button>
        </div>
      </div>

    </div><!-- /inputs -->

    <div class="pipeline" id="pipeline">
      <div class="empty-state" id="emptyState">
        <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
        </svg>
        <p>Upload your resume and a job description,<br>then click <strong>Run All 5 Steps</strong>.</p>
        <p style="font-size:11px;margin-top:4px;">Voice preferences are saved automatically.</p>
      </div>
    </div>

  </div><!-- /layout -->

  <script src="app.js"></script>
</body>
</html>
